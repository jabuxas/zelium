name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    # Runner ARM nativo (grátis em repos públicos) — o alvo do deploy
    # (OCI lutwidge) é linux/arm64, então a imagem sai na arquitetura certa.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push do backend
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/jabuxas/zelium-backend:latest
            ghcr.io/jabuxas/zelium-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push do frontend
        uses: docker/build-push-action@v6
        with:
          context: src/front
          file: src/front/Dockerfile
          platforms: linux/arm64
          push: true
          # Mesma origem: o NPM encaminha /api e /uploads para o backend
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ghcr.io/jabuxas/zelium-frontend:latest
            ghcr.io/jabuxas/zelium-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Dispara webhook do Dockhand
        run: |
          curl -fsS -X POST \
            -H "X-Gitlab-Token: ${{ secrets.DOCKHAND_WEBHOOK_TOKEN }}" \
            https://hook.jabuxas.com/api/git/stacks/5/webhook
